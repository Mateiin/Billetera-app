<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

    <div class="w-full max-w-5xl space-y-6">
        
        <header class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-lg">
                    <div class="w-5 h-5 bg-black rounded-full"></div>
                </div>
                <div>
                    <h2 class="text-lg font-medium leading-none text-white">Hola, <span id="nombreUsuario">Usuario</span></h2>
                    <p class="text-zinc-500 text-xs uppercase tracking-wider mt-1">Nexus ID: 8492-2025</p>
                </div>
            </div>
            <button onclick="cerrarSesion()" class="p-3 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 text-zinc-400 hover:text-white transition-all cursor-pointer">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </header>

        <div class="grid md:grid-cols-3 gap-6">
            
            <div class="md:col-span-2 space-y-6">
                
                <div class="glass-card rounded-3xl p-8 relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <p class="text-zinc-400 font-medium">Caja de Ahorro</p>
                            <span class="bg-zinc-800 text-xs px-2 py-1 rounded text-zinc-300">ARS</span>
                        </div>
                        <h3 class="text-5xl font-light tracking-tighter tabular-nums text-white mb-6">
                            $ <span id="saldoArs">...</span>
                        </h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-black/20 p-3 rounded-xl border border-white/5">
                                <p class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">CBU</p>
                                <p class="text-white font-mono text-xs truncate" id="cbuArs">Cargando...</p>
                            </div>
                            <div class="bg-black/20 p-3 rounded-xl border border-white/5">
                                <p class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">Alias</p>
                                <p class="text-emerald-400 font-mono text-xs truncate" id="aliasArs">Cargando...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card rounded-3xl p-8 relative overflow-hidden group border-emerald-900/30">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500/5 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <p class="text-emerald-400/80 font-medium">Cuenta Dólares</p>
                            <span class="bg-emerald-950 text-xs px-2 py-1 rounded text-emerald-400 border border-emerald-900">USD</span>
                        </div>
                        <h3 class="text-5xl font-light tracking-tighter tabular-nums text-emerald-100 mb-6">
                            u$s <span id="saldoUsd">...</span>
                        </h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-emerald-950/30 p-3 rounded-xl border border-emerald-900/20">
                                <p class="text-[10px] text-emerald-600 uppercase tracking-wider mb-1">CBU</p>
                                <p class="text-emerald-100 font-mono text-xs truncate" id="cbuUsd">Cargando...</p>
                            </div>
                            <div class="bg-emerald-950/30 p-3 rounded-xl border border-emerald-900/20">
                                <p class="text-[10px] text-emerald-600 uppercase tracking-wider mb-1">Alias</p>
                                <p class="text-emerald-400 font-mono text-xs truncate" id="aliasUsd">Cargando...</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="md:col-span-1 space-y-4">
                
                <button onclick="ingresarDinero()" class="w-full h-32 bg-white text-black rounded-3xl p-6 flex flex-col items-start justify-between hover:bg-zinc-200 transition-colors cursor-pointer">
                    <div class="p-2 bg-black/5 rounded-full"><i data-lucide="plus" class="w-6 h-6"></i></div>
                    <span class="font-medium">Ingresar Pesos</span>
                </button>

                <button onclick="transferirDinero()" class="w-full h-32 glass-card hover:bg-white/10 rounded-3xl p-6 flex flex-col items-start justify-between transition-colors cursor-pointer">
                    <div class="p-2 bg-white/10 rounded-full text-white"><i data-lucide="send" class="w-6 h-6"></i></div>
                    <span class="font-medium text-white">Transferir</span>
                </button>
                
                <button onclick="comprarDolares()" id="btnComprar" class="w-full h-24 border border-emerald-800/50 bg-emerald-950/10 rounded-3xl p-6 flex flex-col justify-center items-start gap-1 cursor-pointer hover:bg-emerald-900/20 transition-all">
                    <div class="flex items-center gap-2 text-emerald-500">
                        <i data-lucide="dollar-sign" class="w-5 h-5"></i>
                        <span class="font-medium">Comprar USD</span>
                    </div>
                    <p class="text-xs text-emerald-400/70">
                        Cotización: $ <span id="precioDolar">Cargando...</span>
                    </p>
                </button>
            </div>
        </div>

        <div class="glass-card rounded-3xl p-8 mt-6">
            <h3 class="text-xl font-light text-white mb-6">Transacciones Recientes</h3>
            <div id="lista-movimientos" class="space-y-4">
                <p class="text-zinc-500 text-center">Cargando movimientos...</p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const emailGuardado = localStorage.getItem('emailUsuario');
        if(!emailGuardado) { window.location.href = "iniciosesion.html"; } 
        else {
            cargarNombre(emailGuardado);
            cargarDatosCuenta(emailGuardado); 
            cargarMovimientos(emailGuardado);
            cargarCotizacion(); 
        }

        // --- FUNCIONES DE CARGA ---
        async function cargarNombre(email) {
            try {
                const response = await fetch(`/api/usuarios/nombre?email=${email}`);
                if (response.ok) {
                    const nombreCompleto = await response.text();
                    document.getElementById('nombreUsuario').innerText = nombreCompleto.split(' ')[0];
                }
            } catch (error) { console.error(error); }
        }

        async function cargarDatosCuenta(email) {
            try {
                const response = await fetch(`/api/cuentas/datos?email=${email}`);
                if (response.ok) {
                    const datos = await response.json();
                    document.getElementById('saldoArs').innerText = datos.saldoArs?.toLocaleString('es-AR', { minimumFractionDigits: 2 }) || "0,00";
                    document.getElementById('cbuArs').innerText = datos.cbuArs || "No disponible";
                    document.getElementById('aliasArs').innerText = datos.aliasArs || "No disponible";
                    document.getElementById('saldoUsd').innerText = datos.saldoUsd?.toLocaleString('en-US', { minimumFractionDigits: 2 }) || "0.00";
                    document.getElementById('cbuUsd').innerText = datos.cbuUsd || "No disponible";
                    document.getElementById('aliasUsd').innerText = datos.aliasUsd || "No disponible";
                }
            } catch (error) { console.error(error); }
        }

        async function cargarMovimientos(email) {
            try {
                const response = await fetch(`/api/transacciones?email=${email}`);
                if (response.ok) {
                    const movimientos = await response.json();
                    const listaDiv = document.getElementById('lista-movimientos');
                    listaDiv.innerHTML = ""; 
                    if(movimientos.length === 0) listaDiv.innerHTML = '<p class="text-zinc-500 text-center">No hay movimientos.</p>';

                    movimientos.forEach(mov => {
                        const esGasto = mov.tipo === "GASTO";
                        const itemHtml = `
                        <div class="flex items-center justify-between p-4 hover:bg-white/5 rounded-2xl transition-colors border border-transparent hover:border-white/5">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full flex items-center justify-center border border-white/5 ${esGasto ? 'bg-white/5 text-white' : 'bg-emerald-500/10 text-emerald-400'}">
                                    <i data-lucide="${esGasto ? 'arrow-up-right' : 'arrow-down-left'}" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p class="font-medium text-white">${mov.descripcion}</p>
                                    <p class="text-xs text-zinc-500">${new Date(mov.fecha).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-medium tabular-nums ${esGasto ? 'text-white' : 'text-emerald-400'}">
                                    ${esGasto ? '-' : '+'} $${mov.monto.toLocaleString('es-AR', { minimumFractionDigits: 2 })}
                                </p>
                                <p class="text-xs text-zinc-500">Completado</p>
                            </div>
                        </div>`;
                        listaDiv.innerHTML += itemHtml;
                    });
                    lucide.createIcons();
                }
            } catch (error) { console.error(error); }
        }

        async function cargarCotizacion() {
            try {
                const response = await fetch('/api/cotizacion');
                if (response.ok) {
                    const datos = await response.json();
                    window.precioDolarVenta = datos.venta;
                    document.getElementById('precioDolar').innerText = datos.venta;
                }
            } catch (error) { console.error(error); }
        }

        // --- FUNCIONES DE ACCIÓN ---

        async function ingresarDinero() {
            const monto = parseFloat(prompt("¿Cuánto dinero (ARS) quieres ingresar?"));
            if (!monto || monto <= 0) return;
            const email = localStorage.getItem('emailUsuario');
            
            await fetch('/api/transacciones/deposito', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, monto: monto })
            });
            cargarDatosCuenta(email);
            cargarMovimientos(email);
        }

        async function transferirDinero() {
            const destinatario = prompt("Ingrese Email, CBU o Alias:");
            if (!destinatario) return;
            const monto = parseFloat(prompt("¿Monto a transferir?"));
            if (!monto || monto <= 0) return;

            const emailOrigen = localStorage.getItem('emailUsuario');
            try {
                const response = await fetch('/api/transacciones/transferencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emailOrigen: emailOrigen, destinatario: destinatario, monto: monto })
                });
                const resultado = await response.text();
                if (resultado === "TRANSFERENCIA_EXITOSA") {
                    alert("¡Enviado!");
                    cargarDatosCuenta(emailOrigen);
                    cargarMovimientos(emailOrigen);
                } else { alert("❌ Error: " + resultado); }
            } catch (error) { console.error(error); }
        }

        // --- COMPRA DE DÓLARES REAL ---
        async function comprarDolares() {
            if (!window.precioDolarVenta) { alert("Cargando cotización..."); return; }

            const cantidadDolares = parseFloat(prompt(`Cotización: $${window.precioDolarVenta}\n¿Cuántos DÓLARES quieres comprar?`));
            
            if (!cantidadDolares || cantidadDolares <= 0) return;

            // Calculamos el costo estimado para avisarle al usuario
            const costoEstimado = cantidadDolares * window.precioDolarVenta;
            const confirma = confirm(`Vas a comprar u$s ${cantidadDolares}\nTe costará $ ${costoEstimado.toLocaleString('es-AR')} ARS.\n¿Confirmar?`);

            if (!confirma) return;

            const email = localStorage.getItem('emailUsuario');
            try {
                const response = await fetch('/api/transacciones/compra-dolar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: email, 
                        montoDolares: cantidadDolares, 
                        precioCotizacion: window.precioDolarVenta 
                    })
                });

                const resultado = await response.text();
                if (resultado === "COMPRA_EXITOSA") {
                    alert("¡Compra exitosa! Disfruta tus dólares.");
                    cargarDatosCuenta(email);
                    cargarMovimientos(email);
                } else if (resultado === "ERROR_SALDO_ARS") {
                    alert("❌ No tienes suficientes pesos.");
                } else {
                    alert("❌ Error: " + resultado);
                }
            } catch (error) { console.error(error); }
        }

        function cerrarSesion() { localStorage.removeItem('emailUsuario'); window.location.href = "iniciosesion.html"; }
    </script>
</body>
</html>
