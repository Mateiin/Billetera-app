<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Animación para cuando vuelve la plata */
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
            50% { box-shadow: 0 0 20px 0 rgba(16, 185, 129, 0.3); }
        }
        .animate-cobro { animation: pulse-green 2s infinite; border-color: rgba(16, 185, 129, 0.5); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

    <div class="w-full max-w-5xl space-y-6">
        
        <header class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-lg">
                    <div class="w-5 h-5 bg-black rounded-full"></div>
                </div>
                <div>
                    <h2 class="text-lg font-medium leading-none text-white">Hola, <span id="nombreUsuario">Usuario</span></h2>
                    <p class="text-zinc-500 text-xs uppercase tracking-wider mt-1">Nexus ID: 8492-2025</p>
                </div>
            </div>
            <button onclick="cerrarSesion()" class="p-3 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 text-zinc-400 hover:text-white transition-all cursor-pointer">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </header>

        <div class="grid md:grid-cols-3 gap-6">
            
            <div class="md:col-span-2 space-y-6">
                
                <div class="glass-card rounded-3xl p-8 relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <p class="text-zinc-400 font-medium">Caja de Ahorro</p>
                            <span class="bg-zinc-800 text-xs px-2 py-1 rounded text-zinc-300">ARS</span>
                        </div>
                        <h3 class="text-5xl font-light tracking-tighter tabular-nums text-white mb-6">
                            $ <span id="saldoArs">...</span>
                        </h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-black/20 p-3 rounded-xl border border-white/5">
                                <p class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">CBU</p>
                                <p class="text-white font-mono text-xs truncate" id="cbuArs">Cargando...</p>
                            </div>
                            <div class="bg-black/20 p-3 rounded-xl border border-white/5">
                                <p class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">Alias</p>
                                <p class="text-emerald-400 font-mono text-xs truncate" id="aliasArs">Cargando...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card rounded-3xl p-8 relative overflow-hidden group border-emerald-900/30">
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <p class="text-emerald-400/80 font-medium">Cuenta Dólares</p>
                            <span class="bg-emerald-950 text-xs px-2 py-1 rounded text-emerald-400 border border-emerald-900">USD</span>
                        </div>
                        <h3 class="text-5xl font-light tracking-tighter tabular-nums text-emerald-100 mb-6">
                            u$s <span id="saldoUsd">...</span>
                        </h3>
                    </div>
                </div>

                <div class="glass-card rounded-3xl p-6">
                    <h3 class="text-lg font-light text-white mb-4 flex items-center gap-2">
                        <i data-lucide="trending-up" class="w-5 h-5 text-purple-400"></i> Plazos Fijos Activos
                    </h3>
                    <div id="lista-inversiones" class="space-y-3">
                        <p class="text-zinc-500 text-sm">No tienes inversiones en curso.</p>
                    </div>
                </div>

            </div>

            <div class="md:col-span-1 space-y-4">
                
                <button onclick="ingresarDinero()" class="w-full h-24 bg-white text-black rounded-3xl p-6 flex flex-col justify-center items-start gap-1 hover:bg-zinc-200 transition-colors cursor-pointer">
                    <div class="flex items-center gap-2 font-medium"><i data-lucide="plus" class="w-5 h-5"></i> Ingresar Pesos</div>
                </button>

                <button onclick="transferirDinero()" class="w-full h-24 glass-card hover:bg-white/10 rounded-3xl p-6 flex flex-col justify-center items-start gap-1 transition-colors cursor-pointer">
                    <div class="flex items-center gap-2 text-white font-medium"><i data-lucide="send" class="w-5 h-5"></i> Transferir</div>
                </button>
                
                <button onclick="comprarDolares()" id="btnComprar" class="w-full h-24 border border-emerald-800/50 bg-emerald-950/10 rounded-3xl p-6 flex flex-col justify-center items-start gap-1 cursor-pointer hover:bg-emerald-900/20 transition-all">
                    <div class="flex items-center gap-2 text-emerald-500 font-medium"><i data-lucide="dollar-sign" class="w-5 h-5"></i> Comprar USD</div>
                    <p class="text-xs text-emerald-400/70">Cotización: $ <span id="precioDolar">...</span></p>
                </button>

                <button onclick="crearInversion()" class="w-full h-24 border border-purple-800/50 bg-purple-950/10 rounded-3xl p-6 flex flex-col justify-center items-start gap-1 cursor-pointer hover:bg-purple-900/20 transition-all">
                    <div class="flex items-center gap-2 text-purple-400 font-medium"><i data-lucide="bar-chart-3" class="w-5 h-5"></i> Invertir (PF)</div>
                    <p class="text-xs text-purple-400/70">TNA 70% (Simulado 30s)</p>
                </button>
            </div>
        </div>

        <div class="glass-card rounded-3xl p-8 mt-6">
            <h3 class="text-xl font-light text-white mb-6">Historial de Movimientos</h3>
            <div id="lista-movimientos" class="space-y-4">
                <p class="text-zinc-500 text-center">Cargando...</p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const emailGuardado = localStorage.getItem('emailUsuario');
        if(!emailGuardado) window.location.href = "iniciosesion.html";

        // RECARGA AUTOMÁTICA CADA 5 SEGUNDOS PARA VER SI PAGARON EL PLAZO FIJO
        setInterval(() => {
            cargarDatosCuenta(emailGuardado);
            cargarInversiones(emailGuardado);
            cargarMovimientos(emailGuardado);
        }, 5000);

        // Carga Inicial
        cargarTodo();

        function cargarTodo() {
            cargarNombre(emailGuardado);
            cargarDatosCuenta(emailGuardado);
            cargarMovimientos(emailGuardado);
            cargarCotizacion();
            cargarInversiones(emailGuardado);
        }

        async function cargarInversiones(email) {
            try {
                const response = await fetch(`/api/inversiones/lista?email=${email}`);
                if (response.ok) {
                    const inversiones = await response.json();
                    const divLista = document.getElementById('lista-inversiones');
                    divLista.innerHTML = "";

                    if(inversiones.length === 0) {
                        divLista.innerHTML = '<p class="text-zinc-500 text-sm">No tienes inversiones activas.</p>';
                        return;
                    }

                    inversiones.forEach(inv => {
                        const ganancia = inv.gananciaCalculada.toLocaleString('es-AR', { minimumFractionDigits: 2 });
                        const monto = inv.montoInvertido.toLocaleString('es-AR', { minimumFractionDigits: 2 });
                        // Mostramos solo los segundos restantes aprox
                        divLista.innerHTML += `
                            <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-purple-500/30 animate-pulse">
                                <div>
                                    <p class="text-white font-medium">$ ${monto}</p>
                                    <p class="text-xs text-purple-400">Ganarás: +$ ${ganancia}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-xs text-zinc-400">Estado:</p>
                                    <p class="text-sm text-white font-mono">PROCESANDO...</p>
                                </div>
                            </div>`;
                    });
                }
            } catch (error) {}
        }

        async function crearInversion() {
            const monto = parseFloat(prompt("Monto a Invertir (ARS):"));
            if (!monto || monto <= 0) return;
            const confirmacion = confirm(`Invertir $${monto} por 30 segundos?\nTe devolveremos Capital + Interés.`);
            if(!confirmacion) return;

            try {
                const response = await fetch('/api/inversiones/crear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailGuardado, monto: monto, segundosSimulacion: 30 })
                });
                if (await response.text() === "INVERSION_EXITOSA") {
                    alert("✅ ¡Inversión creada! Espera 30 segundos y verás la ganancia.");
                    cargarTodo();
                } else { alert("❌ Saldo insuficiente."); }
            } catch (error) {}
        }

        // --- RESTO DE FUNCIONES (Igual que antes) ---
        async function cargarNombre(email) {
            const r = await fetch(`/api/usuarios/nombre?email=${email}`);
            if(r.ok) document.getElementById('nombreUsuario').innerText = (await r.text()).split(' ')[0];
        }
        async function cargarDatosCuenta(email) {
            const r = await fetch(`/api/cuentas/datos?email=${email}`);
            if(r.ok) {
                const d = await r.json();
                document.getElementById('saldoArs').innerText = d.saldoArs?.toLocaleString('es-AR', { minimumFractionDigits: 2 });
                document.getElementById('cbuArs').innerText = d.cbuArs || "-";
                document.getElementById('aliasArs').innerText = d.aliasArs || "-";
                document.getElementById('saldoUsd').innerText = d.saldoUsd?.toLocaleString('en-US', { minimumFractionDigits: 2 });
                document.getElementById('cbuUsd').innerText = d.cbuUsd || "-";
                document.getElementById('aliasUsd').innerText = d.aliasUsd || "-";
            }
        }
        async function cargarCotizacion() {
            const r = await fetch('/api/cotizacion');
            if(r.ok) {
                const d = await r.json();
                window.precioDolarVenta = d.venta;
                document.getElementById('precioDolar').innerText = d.venta;
            }
        }
        async function cargarMovimientos(email) {
            const r = await fetch(`/api/transacciones?email=${email}`);
            if (r.ok) {
                const m = await r.json();
                const l = document.getElementById('lista-movimientos');
                l.innerHTML = "";
                if(m.length === 0) l.innerHTML = '<p class="text-zinc-500 text-center">Sin movimientos.</p>';
                m.forEach(mov => {
                    const esGasto = mov.tipo === "GASTO";
                    const esVerde = !esGasto || mov.descripcion.includes("Cobro"); // Truco visual
                    const itemHtml = `
                    <div class="flex items-center justify-between p-4 hover:bg-white/5 rounded-2xl transition-colors border border-transparent hover:border-white/5">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center border border-white/5 ${esVerde ? 'bg-emerald-500/10 text-emerald-400' : 'bg-white/5 text-white'}">
                                <i data-lucide="${esVerde ? 'arrow-down-left' : 'arrow-up-right'}" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <p class="font-medium text-white">${mov.descripcion}</p>
                                <p class="text-xs text-zinc-500">${new Date(mov.fecha).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-medium tabular-nums ${esVerde ? 'text-emerald-400' : 'text-white'}">
                                ${esVerde ? '+' : '-'} $${mov.monto.toLocaleString('es-AR', { minimumFractionDigits: 2 })}
                            </p>
                        </div>
                    </div>`;
                    l.innerHTML += itemHtml;
                });
                lucide.createIcons();
            }
        }
        async function ingresarDinero() {
            const m = parseFloat(prompt("Monto (ARS):"));
            if(!m) return;
            await fetch('/api/transacciones/deposito', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email:emailGuardado, monto:m})});
            cargarTodo();
        }
        async function transferirDinero() {
            const d = prompt("Destino:"); if(!d) return;
            const m = parseFloat(prompt("Monto:")); if(!m) return;
            const r = await fetch('/api/transacciones/transferencia', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({emailOrigen:emailGuardado, destinatario:d, monto:m})});
            if((await r.text()) === "TRANSFERENCIA_EXITOSA") { alert("Enviado!"); cargarTodo(); } else alert("Error");
        }
        async function comprarDolares() {
            if(!window.precioDolarVenta) return alert("Cargando cotización...");
            const c = parseFloat(prompt(`Cotización: $${window.precioDolarVenta}\nCantidad USD:`));
            if(!c) return;
            const r = await fetch('/api/transacciones/compra-dolar', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email:emailGuardado, montoDolares:c, precioCotizacion:window.precioDolarVenta})});
            if((await r.text()) === "COMPRA_EXITOSA") { alert("Comprado!"); cargarTodo(); } else alert("Error saldo");
        }
        function cerrarSesion() { localStorage.removeItem('emailUsuario'); window.location.href = "iniciosesion.html"; }
    </script>
</body>
</html>
