<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Wallet</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #18181b; /* Zinc 950 */
            color: #f4f4f5; /* Zinc 100 */
        }
        
        /* Efecto Vidrio (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Animaciones suaves */
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

    <div class="w-full max-w-5xl space-y-6">
        
        <header class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-lg">
                    <div class="w-5 h-5 bg-black rounded-full"></div>
                </div>
                <div>
                    <h2 class="text-lg font-medium leading-none text-white">Hola, <span id="nombreUsuario">Usuario</span></h2>
                    <p class="text-zinc-500 text-xs uppercase tracking-wider mt-1">Nexus ID: 8492-2025</p>
                </div>
            </div>
            <button onclick="cerrarSesion()" 
                class="p-3 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 text-zinc-400 hover:text-white transition-all cursor-pointer" 
                aria-label="Cerrar sesión">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </header>

        <div class="grid md:grid-cols-3 gap-6">
            
            <div class="md:col-span-2 glass-card rounded-3xl p-8 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-3xl -mr-16 -mt-16 transition-opacity group-hover:opacity-75 pointer-events-none"></div>

                <div class="relative z-10 flex flex-col justify-between h-full min-h-[200px]">
                    <div>
                        <p class="text-zinc-400 font-medium mb-2">Saldo Disponible</p>
                        <h3 class="text-5xl md:text-6xl font-light tracking-tighter tabular-nums text-white">
                            $ <span id="saldo">...</span> <span class="text-zinc-500 text-3xl">ARS</span>
                        </h3>
                    </div>

                    <div class="flex items-center gap-2 mt-8">
                        <span class="flex items-center gap-1 text-emerald-400 bg-emerald-400/10 px-3 py-1 rounded-full text-sm font-medium border border-emerald-400/20">
                            <i data-lucide="activity" class="w-3 h-3"></i> +2.4%
                        </span>
                        <span class="text-zinc-500 text-sm">vs mes pasado</span>
                    </div>
                </div>
            </div>

            <div class="md:col-span-1 space-y-4">
                <button onclick="ingresarDinero()" class="w-full h-[calc(50%-8px)] bg-white text-black rounded-3xl p-6 flex flex-col items-start justify-between hover:bg-zinc-200 transition-colors group cursor-pointer">
                    <div class="p-3 bg-black/5 rounded-full">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </div>
                    <div class="text-left">
                        <span class="text-lg font-medium block">Ingresar</span>
                        <span class="text-black/60 text-sm">Dinero a cuenta</span>
                    </div>
                </button>

                <button onclick="transferirDinero()" class="w-full h-[calc(50%-8px)] glass-card hover:bg-white/10 rounded-3xl p-6 flex flex-col items-start justify-between transition-colors group cursor-pointer">
                    <div class="p-3 bg-white/10 rounded-full text-white">
                        <i data-lucide="send" class="w-6 h-6"></i>
                    </div>
                    <div class="text-left">
                        <span class="text-lg font-medium block text-white">Transferir</span>
                        <span class="text-zinc-400 text-sm">Enviar a contacto</span>
                    </div>
                </button>
            </div>
        </div>

        <div class="glass-card rounded-3xl p-8 mt-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-light text-white">Transacciones Recientes</h3>
                <button class="text-sm text-zinc-400 hover:text-white transition-colors">Ver todo</button>
            </div>

            <div id="lista-movimientos" class="space-y-4">
                <p class="text-zinc-500 text-center">Cargando movimientos...</p>
            </div>
        </div>
    </div>

    <script>
        // Inicializar Iconos
        lucide.createIcons();

        // 1. VERIFICAR SESIÓN
        const emailGuardado = localStorage.getItem('emailUsuario');
        
        if(!emailGuardado) {
            window.location.href = "iniciosesion.html"; 
        } else {
            cargarNombre(emailGuardado);
            cargarSaldo(emailGuardado);
            cargarMovimientos(emailGuardado);
        }

        // 2. CARGAR SALDO
        async function cargarSaldo(email) {
            try {
                const response = await fetch(`/api/cuentas/saldo?email=${email}`);
                if (response.ok) {
                    const saldo = await response.json();
                    document.getElementById('saldo').innerText = saldo.toLocaleString('es-AR', { minimumFractionDigits: 2 });
                }
            } catch (error) { console.error(error); }
        }

        // FUNCIÓN MODIFICADA: Solo el primer nombre
        async function cargarNombre(email) {
            try {
                const response = await fetch(`/api/usuarios/nombre?email=${email}`);
                if (response.ok) {
                    const nombreCompleto = await response.text();
                    
                    // AQUÍ ESTÁ EL TRUCO:
                    // 1. split(' ') separa las palabras en una lista ["Mateo", "Caullo"]
                    // 2. [0] toma la primera palabra ("Mateo")
                    const primerNombre = nombreCompleto.split(' ')[0]; 
                    
                    document.getElementById('nombreUsuario').innerText = primerNombre;
                }
            } catch (error) {
                console.error("Error al cargar nombre:", error);
            }
        }

        // 3. CARGAR MOVIMIENTOS (CON EL NUEVO DISEÑO)
        async function cargarMovimientos(email) {
            try {
                const response = await fetch(`/api/transacciones?email=${email}`);
                if (response.ok) {
                    const movimientos = await response.json();
                    const listaDiv = document.getElementById('lista-movimientos');
                    listaDiv.innerHTML = ""; 

                    if(movimientos.length === 0) {
                        listaDiv.innerHTML = '<p class="text-zinc-500 text-center">No hay movimientos aún.</p>';
                        return;
                    }

                    // Recorremos y dibujamos con el estilo futurista
                    movimientos.forEach(mov => {
                        const esGasto = mov.tipo === "GASTO";
                        
                        // Estilos dinámicos según tipo
                        const icono = esGasto ? 'arrow-up-right' : 'arrow-down-left';
                        const colorIconoBg = esGasto ? 'bg-white/5' : 'bg-emerald-500/10';
                        const colorIconoTxt = esGasto ? 'text-white' : 'text-emerald-400';
                        const colorMonto = esGasto ? 'text-white' : 'text-emerald-400';
                        const signo = esGasto ? '-' : '+';
                        const fecha = new Date(mov.fecha).toLocaleDateString('es-AR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

                        const itemHtml = `
                        <div class="flex items-center justify-between p-4 hover:bg-white/5 rounded-2xl transition-colors group border border-transparent hover:border-white/5">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full flex items-center justify-center border border-white/5 ${colorIconoBg} ${colorIconoTxt}">
                                    <i data-lucide="${icono}" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p class="font-medium text-white group-hover:text-white transition-colors">${mov.descripcion}</p>
                                    <p class="text-xs text-zinc-500">${fecha}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-medium tabular-nums ${colorMonto}">
                                    ${signo} $${mov.monto.toLocaleString('es-AR', { minimumFractionDigits: 2 })}
                                </p>
                                <p class="text-xs text-zinc-500">Completado</p>
                            </div>
                        </div>
                        `;
                        listaDiv.innerHTML += itemHtml;
                    });
                    // Reiniciamos los iconos para los nuevos elementos agregados
                    lucide.createIcons();
                }
            } catch (error) { console.error(error); }
        }

        // 4. INGRESAR DINERO
        async function ingresarDinero() {
            const montoStr = prompt("¿Cuánto dinero quieres ingresar?");
            if (!montoStr) return;
            const monto = parseFloat(montoStr);
            if (isNaN(monto) || monto <= 0) { alert("Monto inválido."); return; }

            const email = localStorage.getItem('emailUsuario');
            try {
                const response = await fetch('/api/transacciones/deposito', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, monto: monto })
                });

                if (await response.text() === "DEPOSITO_EXITOSO") {
                    // alert("¡Dinero acreditado!"); // Quitamos el alert para que sea más fluido
                    cargarSaldo(email);
                    cargarMovimientos(email);
                } else { alert("Error en el depósito."); }
            } catch (error) { console.error(error); }
        }

        // 5. TRANSFERIR DINERO
        async function transferirDinero() {
            const emailDestino = prompt("Ingrese el EMAIL del destinatario:");
            if (!emailDestino) return;
            const montoStr = prompt("¿Cuánto desea transferir?");
            if (!montoStr) return;
            const monto = parseFloat(montoStr);
            if (isNaN(monto) || monto <= 0) { alert("Monto inválido."); return; }

            const emailOrigen = localStorage.getItem('emailUsuario');
            try {
                const response = await fetch('/api/transacciones/transferencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emailOrigen: emailOrigen, emailDestino: emailDestino, monto: monto })
                });
                const resultado = await response.text();

                if (resultado === "TRANSFERENCIA_EXITOSA") {
                    alert("¡Transferencia enviada!");
                    cargarSaldo(emailOrigen);
                    cargarMovimientos(emailOrigen);
                } else if (resultado === "ERROR_SALDO") {
                    alert("❌ No tienes saldo suficiente.");
                } else { alert("❌ Error: Usuario no encontrado."); }
            } catch (error) { console.error(error); }
        }

        // 6. CERRAR SESIÓN
        function cerrarSesion() {
            localStorage.removeItem('emailUsuario');
            window.location.href = "iniciosesion.html";
        }
    </script>
</body>
</html>
