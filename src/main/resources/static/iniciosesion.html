<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Fintech</title>
    <style>
        /* Un estilo mínimo para que no se vea tan feo */
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .login-container { border: 1px solid #ccc; padding: 20px; border-radius: 5px; width: 300px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; }
        .exito { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="admin@fintech.com">
            
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="123456">
            
            <button type="submit">Ingresar</button>
        </form>

        <div id="mensaje"></div>
    </div>

    <script>
        // 1. Obtenemos los elementos del HTML
        const loginForm = document.getElementById('loginForm');
        const mensajeDiv = document.getElementById('mensaje');

        // 2. Escuchamos cuando se envía el formulario (el clic en "Ingresar")
        loginForm.addEventListener('submit', async (e) => {
            // Evitamos que la página se recargue (el comportamiento por defecto)
            e.preventDefault();

            // 3. Tomamos los valores que escribió el usuario
            const emailValue = document.getElementById('email').value;
            const passwordValue = document.getElementById('password').value;

            // 4. Creamos el objeto JSON para enviar al backend
            // Los nombres 'email' y 'password' deben coincidir con la clase LoginRequest en Java
            const dataToSend = {
                email: emailValue,
                password: passwordValue
            };

            mensajeDiv.textContent = "Enviando...";
            mensajeDiv.className = "";

            try {
                // 5. Hacemos la petición POST al backend usando fetch
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                        // Esto es CLAVE: le dice a Java que le estamos mandando JSON
                    },
                    body: JSON.stringify(dataToSend) // Convertimos el objeto JS a texto JSON
                });

                // 6. Leemos la respuesta del servidor (texto plano)
                const resultadoTexto = await response.text();

                // 7. Mostramos el mensaje según la respuesta
                // 7. Mostramos el mensaje según la respuesta
                if (resultadoTexto === "LOGIN_EXITOSO") {
                    mensajeDiv.textContent = "¡Bienvenido! Redirigiendo...";
                    mensajeDiv.className = "exito";
                    
                    // GUARDAMOS EL EMAIL EN EL NAVEGADOR (Para saber quién es en la otra página)
                    localStorage.setItem('emailUsuario', emailValue);

                    // ESPERAMOS 1 SEGUNDO Y CAMBIAMOS DE PÁGINA
                    setTimeout(() => {
                        window.location.href = "/home.html";
                    }, 1000);
                    
                } else {
                    mensajeDiv.textContent = "Error: Usuario o contraseña incorrectos.";
                    mensajeDiv.className = "error";
                }

            } catch (error) {
                console.error('Error:', error);
                mensajeDiv.textContent = "Error de conexión con el servidor.";
                mensajeDiv.className = "error";
            }
        });
    </script>

</body>
</html>
